    algorithm.student_learning_rate: 0.002
    algorithm.student_train_epochs: 50
    algorithm.bootstrap_training_mode: pure_snn
    algorithm.bootstrap_timesteps: 20
    algorithm.bootstrap_readout: mean
    algorithm.bootstrap_neuron_threshold: 0.2
    algorithm.bootstrap_current_decay: 0.3
    algorithm.bootstrap_voltage_decay: 0.02
    algorithm.bootstrap_input_strategy: signed_split
    algorithm.bootstrap_input_weight: 1.0
    algorithm.bootstrap_input_bias: 0.0
